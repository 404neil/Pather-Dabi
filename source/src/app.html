<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pather Dabi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--bg:#fff;--mist:#f2f4f8;--line:#d5dae5}
@media(prefers-color-scheme:dark){:root{--ink:#e8ecf5;--bg:#121a2b;--mist:#1b2336;--line:#33405c}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#map{position:fixed;inset:0 0 calc(54px + env(safe-area-inset-bottom,0px)) 0}#map.adding{cursor:crosshair}
#chips{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:56px;z-index:1000;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:5px 11px;border-radius:99px;display:flex;gap:6px;align-items:center;white-space:nowrap;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%}.chip[aria-pressed=false]{opacity:.45}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:1002;height:calc(54px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--bg);border-top:1px solid var(--line)}
#nav button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
#nav button:last-child{color:var(--ink)}#nav button[data-t=help]{color:#d64545}
button.main{background:var(--ink);color:var(--bg);border:0;font:inherit;font-weight:700;padding:12px 20px;border-radius:99px;cursor:pointer}
button.sub,button.item{background:var(--bg);color:var(--ink);border:1px solid var(--line);font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;cursor:pointer}
button.item{display:block;width:100%;text-align:left;margin-bottom:8px}button.item small{display:block;opacity:.75}
#addBtn{position:fixed;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:1001;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#note{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 50px);z-index:1003;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:15px;max-width:92%;text-align:center}
#panel{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:1001;max-width:480px;margin:0 auto;max-height:68vh;overflow:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px;box-shadow:0 -4px 24px rgba(0,0,0,.25)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px}.ph button{border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
#panel input[type=text],#panel textarea,.pop input{width:100%;font:inherit;color:var(--ink);background:var(--mist);border:1px solid var(--line);border-radius:10px;padding:9px;margin:6px 0}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}.rl{display:flex;gap:8px;align-items:center;margin:6px 0}.rl span{flex:1;overflow-wrap:anywhere;font-size:14px}.m{opacity:.75}
.hidden{display:none!important}
.pop{min-width:210px;font:15px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;color:#14213d}.pop p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.pop small{color:#5b6478}
.pop .cat{font-weight:700;display:flex;gap:6px;align-items:center}.pop .cat i{width:10px;height:10px;border-radius:50%}
.pop ul{list-style:none;margin:8px 0;padding:0;max-height:120px;overflow:auto}.pop li{border-top:1px solid #d5dae5;padding:4px 0;overflow-wrap:anywhere}
.pop button{font:inherit;font-size:14px;border:1px solid #d5dae5;background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;color:#14213d}.pop button.on{background:#14213d;color:#fff}.pop button.link{border:0;padding:0;text-decoration:underline;background:none}
.pop .vr,.pop .add{display:flex;gap:6px;margin:6px 0}.pop .add input{background:#f2f4f8;color:#14213d;margin:0}
.bub{background:var(--mist);border-radius:12px;padding:6px 10px;margin:6px 0;max-width:85%;overflow-wrap:anywhere}.bub.me{margin-left:auto;background:var(--line)}.bub small{opacity:.7;display:block}
#syncBtn{position:fixed;left:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:1001;background:#ffb703;color:#14213d;border:2px solid #14213d;font:inherit;font-weight:700;padding:11px 16px;border-radius:99px;box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:pointer}
details{border-bottom:1px solid var(--line);padding:6px 0}summary{font-weight:700;cursor:pointer}details p{margin:6px 0}
:focus-visible{outline:3px solid #e08a1e;outline-offset:2px}
</style></head><body>
<div id="map"></div><div id="chips"></div><div id="note" class="hidden"></div>
<button class="main" id="addBtn">Add a pin</button><button id="syncBtn">⇄ Sync</button>
<nav id="nav"><button data-t="map">Map</button><button data-t="help">Help</button><button data-t="chat">Chats</button><button data-t="guide">Guide</button><button data-t="me">Me</button><button data-t="set">Settings</button></nav>
<div id="panel" class="hidden"></div><input type="file" id="bfile" accept=".geojson,.json,application/json" class="hidden">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module">
import{generateSecretKey,getPublicKey,finalizeEvent,verifyEvent,getEventHash,nip44,nip19}from"https://esm.sh/nostr-tools@2.7.2";
const APP="pather-dabi-v1",HELP="help needed",DEF=["wss://relay.damus.io","wss://nos.lol","wss://relay.primal.net"];
const EMBEDDED_BOUNDARY=``; // paste the official India GeoJSON between the backticks to embed it in this file
const $=s=>document.querySelector(s),now=()=>Math.floor(Date.now()/1000);
const h=(t,p={},...c)=>{const e=document.createElement(t);for(const k in p)k==="class"?e.className=p[k]:k.startsWith("on")?e.addEventListener(k.slice(2),p[k]):e.setAttribute(k,p[k]);e.append(...c);return e};
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join(""),unhex=s=>Uint8Array.from(s.match(/../g).map(x=>parseInt(x,16)));
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},lsw=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const note=(m,ms=6000)=>{const n=$("#note");n.textContent=m;n.classList.remove("hidden");clearTimeout(note.t);note.t=setTimeout(()=>n.classList.add("hidden"),ms)};
const left=e=>{const m=Math.max(1,Math.round((e-now())/60));return m>=90?Math.round(m/60)+" h":m+" min"};
const norm=s=>{s=s.toLowerCase().replace(/[^\p{L}\p{N} -]/gu,"").replace(/[\s-]+/g," ").trim().slice(0,24);return s.replace(/ /g,"")==="helpneeded"?HELP:s};
const col=x=>x===HELP?"#d64545":`hsl(${Math.abs([...x].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360},62%,46%)`;
const lab=x=>x===HELP?"HELP NEEDED":x;
let sk;try{const s=localStorage.getItem("pb_sk");if(s)sk=unhex(s)}catch{}
if(!sk){sk=generateSecretKey();try{localStorage.setItem("pb_sk",hex(sk))}catch{}}
const pk=getPublicKey(sk);

/* map: borderless base layers + official boundary overlay */
const map=L.map("map",{zoomControl:false,minZoom:3,worldCopyJump:true}).setView([22.5,80],5);
L.control.zoom({position:"topright"}).addTo(map);
const at="Tiles © Esri",es=n=>`https://server.arcgisonline.com/ArcGIS/rest/services/${n}/MapServer/tile/{z}/{y}/{x}`;
const bases={"Satellite":L.tileLayer(es("World_Imagery"),{maxZoom:18,attribution:at}),
"Relief":L.tileLayer(es("World_Shaded_Relief"),{maxZoom:18,maxNativeZoom:13,attribution:at}),
"Physical":L.tileLayer(es("World_Physical_Map"),{maxZoom:18,maxNativeZoom:8,attribution:at}),
"Street":L.tileLayer(es("World_Street_Map"),{maxZoom:18,maxNativeZoom:17,attribution:at})};
(bases[ls("pb_base","Satellite")]||bases.Satellite).addTo(map);
L.control.layers(bases,null,{position:"topright"}).addTo(map);map.attributionControl.addAttribution("India outline © OpenStreetMap contributors");
map.on("baselayerchange",e=>lsw("pb_base",e.name));
let bl=null;const draw=g=>{if(bl)map.removeLayer(bl);bl=L.geoJSON(g,{interactive:false,style:{color:"#ffd166",weight:2,fill:false}}).addTo(map)};
(()=>{let t=EMBEDDED_BOUNDARY.trim();if(!t)try{t=localStorage.getItem("pb_boundary")||""}catch{}
try{if(t)return draw(JSON.parse(t))}catch{}note("No India boundary loaded. Open Settings to load the official GeoJSON.",12000)})();
$("#bfile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const t=await f.text();draw(JSON.parse(t));try{localStorage.setItem("pb_boundary",t)}catch{note("Loaded for this session only. Paste it into EMBEDDED_BOUNDARY to keep it.")}}catch{note("That file isn't valid GeoJSON.")}};

/* state */
const pins=new Map(),votes=new Map(),comments=new Map(),profiles=new Map(),contacts=new Map(),seen=new Set(),hidden=new Set(),markers=new Map(),asked=new Set(),msgs=new Map(),gname=new Map();
const layer=L.layerGroup().addTo(map);let openKey=null,openPopup=null,panelFn=null,tm,wt;
const tag=(e,n)=>(e.tags.find(t=>t[0]===n)||[])[1];
const nm=p=>(profiles.get(p)||{}).name||nip19.npubEncode(p).slice(0,12)+"…";
const tally=a=>{let up=0,down=0;for(const x of(votes.get(a)||new Map()).values())x.v>0?up++:down++;return{up,down}};
/* lifespan rules: help = 12 h; others = 2 h, 24 h with >10 upvotes, removed at net -3 */
function status(k){const p=pins.get(k);if(!p||p.d.del)return null;const t=p.ev.created_at,{up,down}=tally("30078:"+k);
if(p.d.h===HELP){const end=t+43200;return now()<end?{end,up,down}:null}
if(up-down<=-3)return null;const end=t+(up>10?86400:7200);return now()<end?{end,up,down}:null}
function parsePin(c){try{const d=JSON.parse(c);if(d.del)return{del:1};const x=norm(String(d.h||""));
if(typeof d.lat!=="number"||typeof d.lng!=="number"||Math.abs(d.lat)>90||Math.abs(d.lng)>180||!x||typeof d.text!=="string")return null;
return{lat:d.lat,lng:d.lng,h:x,text:d.text.slice(0,280)}}catch{return null}}
function want(p){if(profiles.has(p)||asked.has(p))return;asked.add(p);clearTimeout(wt);wt=setTimeout(()=>req("pf",[{kinds:[0],authors:[...asked]}]),500)}
const later=()=>{clearTimeout(tm);tm=setTimeout(()=>{render();if(panelFn)panelFn();if(openKey&&openPopup)openPopup.setContent(popup(openKey))},300)};
function ingest(ev){
if(seen.has(ev.id)||!verifyEvent(ev))return;seen.add(ev.id);const k=ev.kind;
if(k===0){try{const d=JSON.parse(ev.content),c=profiles.get(ev.pubkey);if(!c||c.t<ev.created_at)profiles.set(ev.pubkey,{t:ev.created_at,name:String(d.name||"").slice(0,40),about:String(d.about||"").slice(0,200)})}catch{}return keep(ev)}
if(k===3){const c=contacts.get(ev.pubkey);if(!c||c.t<ev.created_at){const tg=ev.tags.filter(t=>t[0]==="p");contacts.set(ev.pubkey,{t:ev.created_at,tags:tg,set:new Set(tg.map(t=>t[1]))})}return keep(ev)}
if(k===1059){const mine=tag(ev,"p")===pk,ex=+tag(ev,"expiration");if(!mine&&!(ex>now()&&ex<now()+90000))return;if(mine){const r=unwrap(ev);if(r&&r.id===getEventHash(r))addMsg(r)}return keep(ev)}
if(!ev.tags.some(t=>t[0]==="t"&&t[1]===APP)||ev.created_at<now()-86400)return;
if(k===30078){const d=tag(ev,"d");if(!d)return;const key=ev.pubkey+":"+d,c=pins.get(key);if(c&&c.ev.created_at>=ev.created_at)return;const x=parsePin(ev.content);if(!x)return;pins.set(key,{ev,d:x});want(ev.pubkey)}
else if(k===7){const a=tag(ev,"a");if(!a||!/^30078:[0-9a-f]{64}:\w+$/.test(a))return;const v=ev.content==="+"?1:ev.content==="-"?-1:0;if(!v)return;
const m=votes.get(a)||new Map(),o=m.get(ev.pubkey);if(!o||o.t<=ev.created_at)m.set(ev.pubkey,{v,t:ev.created_at});votes.set(a,m)}
else if(k===1){const a=tag(ev,"a");if(!a)return;const l=comments.get(a)||[];l.push(ev);comments.set(a,l)}
keep(ev)}

function render(){
const vis=new Map(),hs=new Map();for(const[k,p]of pins)if(status(k)){vis.set(k,p);hs.set(p.d.h,(hs.get(p.d.h)||0)+1)}
for(const[k,m]of markers)if(!vis.has(k)||hidden.has(vis.get(k).d.h)){layer.removeLayer(m);markers.delete(k)}
for(const[k,p]of vis){if(markers.has(k)||hidden.has(p.d.h))continue;
const m=L.circleMarker([p.d.lat,p.d.lng],{radius:p.d.h===HELP?14:9,color:"#fff",weight:2,fillColor:col(p.d.h),fillOpacity:1});
m.bindPopup(()=>popup(k),{maxWidth:280});m.on("popupopen",e=>{openKey=k;openPopup=e.popup});m.on("popupclose",()=>{if(openKey===k){openKey=null;openPopup=null}});layer.addLayer(m);markers.set(k,m)}
$("#chips").replaceChildren(...[...new Set([...hs.keys(),...hidden])].sort().map(x=>h("button",{class:"chip","aria-pressed":String(!hidden.has(x)),onclick:()=>{hidden.has(x)?hidden.delete(x):hidden.add(x);render()}},h("i",{style:"background:"+col(x)}),lab(x))))}
setInterval(()=>{for(const[i,m]of msgs)if(m.t<now()-86400)msgs.delete(i);render()},60000);

function popup(k){
const p=pins.get(k),s=status(k);if(!s)return h("div",{class:"pop"},"This pin has expired or was removed.");
const a="30078:"+k,ev=p.ev,mine=ev.pubkey===pk,mv=(votes.get(a)||new Map()).get(pk);
const cast=v=>{const e=finalizeEvent({kind:7,created_at:now(),tags:[["a",a],["t",APP]],content:v>0?"+":"-"},sk);if(send(e))ingest(e)};
const vb=(v,n)=>{const b=h("button",{class:mv&&mv.v===v?"on":"",onclick:()=>cast(v)},(v>0?"👍 ":"👎 ")+n);if(mine)b.disabled=true;return b};
const inp=h("input",{placeholder:"Add a comment",maxlength:"200"});
const box=h("div",{class:"pop"},h("div",{class:"cat"},h("i",{style:"background:"+col(p.d.h)}),lab(p.d.h)),h("p",{},p.d.text),
h("small",{},left(s.end)+" left · by "),h("button",{class:"link",onclick:()=>openProfile(ev.pubkey)},nm(ev.pubkey)),
h("div",{class:"vr"},vb(1,s.up),vb(-1,s.down)),
h("ul",{},...(comments.get(a)||[]).sort((x,y)=>x.created_at-y.created_at).map(x=>h("li",{},x.content.slice(0,200)," ",h("small",{},nm(x.pubkey))))),
h("div",{class:"add"},inp,h("button",{onclick:()=>{const v=inp.value.trim();if(!v)return;const e=finalizeEvent({kind:1,created_at:now(),tags:[["a",a],["t",APP]],content:v},sk);if(send(e)){ingest(e);inp.value=""}}},"Post")));
if(mine)box.append(h("button",{onclick:()=>{if(!confirm("Delete this pin?"))return;const e=finalizeEvent({kind:30078,created_at:now(),tags:[["d",tag(ev,"d")],["t",APP]],content:JSON.stringify({del:1})},sk);if(send(e)){ingest(e);map.closePopup()}}},"Delete pin"));
box.append(h("button",{onclick:()=>openShare(k)},"Share"));
return box}

/* relays */
let relays=ls("pb_relays",DEF.map(u=>({u,on:true})));const socks=new Map(),subs=new Map();
function connect(u){if(socks.has(u))return;let ws;try{ws=new WebSocket(u)}catch{return}socks.set(u,ws);
ws.onopen=()=>{for(const[id,f]of subs)ws.send(JSON.stringify(["REQ",id,...f]));flush()};
ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m[0]==="EVENT")ingest(m[2])}catch{}};
ws.onclose=()=>{socks.delete(u);setTimeout(sync,6000)};ws.onerror=()=>ws.close()}
function sync(){for(const r of relays)if(r.on)connect(r.u);for(const[u,ws]of socks)if(!relays.some(r=>r.on&&r.u===u))ws.close()}
function req(id,f){subs.set(id,f);for(const ws of socks.values())if(ws.readyState===1)ws.send(JSON.stringify(["REQ",id,...f]))}
function send(ev){let n=0;for(const ws of socks.values())if(ws.readyState===1){ws.send(JSON.stringify(["EVENT",ev]));n++}if(!n){store.set(ev.id,ev);unsent.add(ev.id);saveSoon();note("Offline: saved on this device. It will be sent when a relay connects, or via Sync.")}return n||1}
const since=now()-86400;
req("pb",[{kinds:[30078,7,1],"#t":[APP],since},{kinds:[0,3],authors:[pk]},{kinds:[1059],"#p":[pk],since:now()-90000},{kinds:[3],"#p":[pk],limit:500}]);sync();

/* panels */
function show(t,node,live){$("#panel").replaceChildren(h("div",{class:"ph"},h("b",{},t),h("button",{onclick:closePanel,"aria-label":"Close"},"✕")),node);$("#panel").classList.remove("hidden");panelFn=live||null}
let adding=false,temp=null,pt=null,ring=null,myPos=null;
function closePanel(){cleanups.splice(0).forEach(f=>f());$("#panel").classList.add("hidden");panelFn=null;adding=false;pt=null;$("#map").classList.remove("adding");$("#addBtn").classList.remove("hidden");if(temp){map.removeLayer(temp);temp=null}if(ring){map.removeLayer(ring);ring=null}}
$("#nav").onclick=e=>{const t=e.target.dataset.t;if(!t)return;closePanel();({map(){},help:openHelp,chat:openChats,guide:openGuide,me:openMe,set:openSettings})[t]()};

function openHelp(){const d=()=>{const it=[...pins].filter(([k,p])=>p.d.h===HELP&&status(k)).sort((a,b)=>b[1].ev.created_at-a[1].ev.created_at);
show("Help needed",h("div",{},...(it.length?it.map(([k,p])=>{const s=status(k);return h("button",{class:"item",onclick:()=>{closePanel();map.flyTo([p.d.lat,p.d.lng],15);setTimeout(()=>markers.get(k)&&markers.get(k).openPopup(),900)}},h("b",{},p.d.text),h("small",{},`${left(s.end)} left · 👍 ${s.up} 👎 ${s.down} · ${(comments.get("30078:"+k)||[]).length} comments · ${nm(p.ev.pubkey)}`))}):[h("p",{class:"m"},"No active help requests.")])),d)};d()}

$("#addBtn").onclick=async()=>{note("Checking your location…",15000);try{myPos=await here()}catch(m){return note(m)}
if(myPos.accuracy>2000)return note("Your location isn't precise enough to post a pin. Turn on GPS and try again.");
adding=true;$("#map").classList.add("adding");$("#addBtn").classList.add("hidden");ring=L.circle([myPos.latitude,myPos.longitude],{radius:MAXKM*1000,color:"#ffb703",weight:2,dashArray:"6 6",fill:false,interactive:false}).addTo(map);map.fitBounds(ring.getBounds());note("Tap the map inside the dashed circle, within 10 km of where you are.",60000)};
map.on("click",e=>{if(!adding)return;if(km(myPos.latitude,myPos.longitude,e.latlng.lat,e.latlng.lng)>MAXKM)return note("That spot is more than 10 km from you. You can only post pins near your own location.");pt=e.latlng;$("#note").classList.add("hidden");if(temp)map.removeLayer(temp);temp=L.circleMarker(pt,{radius:10,color:"#fff",weight:2,fillColor:"#14213d",fillOpacity:1}).addTo(map);openForm()});
function openForm(){const hd=h("input",{type:"text",list:"hl",placeholder:"Heading, e.g. flood or road blocked",maxlength:"24"}),tx=h("textarea",{rows:"3",maxlength:"280",placeholder:"What should people know?"});
const dl=h("datalist",{id:"hl"},...[...new Set([...pins.values()].map(p=>p.d.h))].filter(x=>x!==HELP).map(x=>h("option",{value:x})));
show("New pin",h("div",{},h("button",{class:"chip",onclick:()=>hd.value="HELP NEEDED"},"Help needed (lasts 12 h)"),hd,dl,tx,h("div",{class:"row"},h("button",{class:"sub",onclick:closePanel},"Cancel"),h("button",{class:"main",onclick:async()=>{
const x=norm(hd.value),t=tx.value.trim();if(!x||!t)return note("Add a heading and a comment.");let c;try{c=await here()}catch(m){return note(m)}if(c.accuracy>2000||km(c.latitude,c.longitude,pt.lat,pt.lng)>MAXKM)return note("You can only post pins within 10 km of where you are right now.");
const exp=now()+(x===HELP?43200:86400),ev=finalizeEvent({kind:30078,created_at:now(),tags:[["d",hex(crypto.getRandomValues(new Uint8Array(4)))],["t",APP],["t",x],["expiration",String(exp)]],content:JSON.stringify({lat:+pt.lat.toFixed(5),lng:+pt.lng.toFixed(5),h:x,text:t})},sk);
if(send(ev)){ingest(ev);closePanel()}}},"Publish pin"))))}

function setFollow(p,on){const c=contacts.get(pk),tg=(c?c.tags:[]).filter(t=>t[1]!==p);if(on)tg.push(["p",p]);const e=finalizeEvent({kind:3,created_at:now(),tags:tg,content:""},sk);if(send(e))ingest(e)}
function openProfile(p){if(p===pk)return openMe();want(p);req("fl",[{kinds:[3],"#p":[p],limit:500},{kinds:[0,3],authors:[p]}]);
